[project]
name = "faceswap-stream-dfm"
version = "0.1.0"
description = "Real-time DFM face-swap pipeline for OBS streaming"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
