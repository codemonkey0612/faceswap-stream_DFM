# Profile: live -- streaming laptop (ASUS ROG Zephyrus G16, RTX 5090 Laptop)
# Overlays on top of config/default.yaml
#
# Tuned for real-time on the laptop:
#  - 1280x720 keeps per-frame CPU work (detect/composite) low; bump to 1080p
#    only if FPS has headroom.
#  - device_index 1 = ASUS FHD / OBSBOT webcam (index 0 is the IR camera).
#  - DSHOW backend is forced in webcam.py (MSMF is slow on this laptop).
#  - CUDA only (TensorRT not installed; listing it adds a ~10s startup stall).

capture:
  width: 1280
  height: 720
  fps: 30
  device_index: 1

detection:
  detect_scale: 0.5          # YuNet on a 0.5x frame -> ~4x faster detection

swap:
  providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider

beauty:
  enable: false              # bilateral filter is the heaviest CPU step; enable
                             # only if FPS allows (it smooths skin outside the swap)

swap_extra:
  color_match: true          # LAB colour-match swap to real skin -> softer neck seam

hand:
  stride: 1                  # run MediaPipe every 2nd frame -> recovers FPS / less heat
  reshape_enable: true       # lengthen the short pinky (privacy)
  pinky_gain: 2.5
  ring_gain: 0.0

output:
  virtual_camera:
    backend: obs
  preview:
    enable: false
